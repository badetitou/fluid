# Publishes the frontend as a static site on GitHub Pages (https://fluid.badetitou.fr) on every
# push to main.
#
# Repository settings: Settings → Pages → Source: "GitHub Actions"; Custom domain: fluid.badetitou.fr.
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   FLUID_BFF_URL              BFF base URL (e.g. https://fluid-bff.example.org). Empty = no BFF.
#   FLUID_DEFAULT_GRAPHQL_URL  GraphQL URL pre-filled on the connect screen.
#   PAGES_BASE_PATH            Base path of the site. Default "/" (custom domain); set it to
#                              "/<repo>/" to serve from https://<owner>.github.io/<repo>/.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          # Only the frontend and its workspace deps (@fluid/shared): enough for the build.
          filter: '@fluid/frontend...'
      - name: Build
        env:
          VITE_BASE: ${{ vars.PAGES_BASE_PATH || '/' }}
        run: |
          echo "Building with base '$VITE_BASE'"
          pnpm --filter @fluid/frontend build
      - name: Runtime config and SPA fallback
        env:
          FLUID_BFF_URL: ${{ vars.FLUID_BFF_URL }}
          FLUID_DEFAULT_GRAPHQL_URL: ${{ vars.FLUID_DEFAULT_GRAPHQL_URL }}
        run: |
          # Same contract as apps/frontend/docker/entrypoint.sh.
          cat > apps/frontend/dist/config.js <<JS
          window.__FLUID_CONFIG__ = {
            bffUrl: "${FLUID_BFF_URL:-}",
            defaultGraphqlUrl: "${FLUID_DEFAULT_GRAPHQL_URL:-}"
          };
          JS
          # GitHub Pages serves 404.html for unknown paths (deep links / refresh).
          cp apps/frontend/dist/index.html apps/frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
