# CI for fluid.
#
#   test         typecheck and tests of every workspace
#   cli-pack     builds the npm tarball (@badetitou/fluid) and smoke-tests it on Linux
#   images       builds and pushes the container images to GitHub Container Registry (ghcr.io)
#   npm-publish  publishes the tarball to npm on version tags (vX.Y.Z), through npm Trusted
#                Publishing (OIDC): no npm token is stored in GitHub.
#
# Releasing: push a tag `vX.Y.Z` on main. The package version is taken from the tag.
# The frontend is published on GitHub Pages by pages.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r typecheck
      - run: pnpm test

  cli-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # On a release tag, the package version is the tag (v1.2.3 → 1.2.3).
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e 'const fs=require("fs");const f="apps/cli/package.publish.json";const p=JSON.parse(fs.readFileSync(f,"utf8"));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "${GITHUB_REF_NAME#v}"
      - run: pnpm pack:cli
      - run: pnpm test:pack
      - uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: out/
          retention-days: 7

  images:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ghcr.io/<owner>/fluid for the all-in-one image, …/fluid/fluid-bff and
          # …/fluid/fluid-frontend for the Helm chart.
          - name: fluid
            dockerfile: Dockerfile
          - name: fluid-bff
            dockerfile: apps/bff/Dockerfile
          - name: fluid-frontend
            dockerfile: apps/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name and tags
        id: meta
        env:
          NAME: ${{ matrix.name }}
        run: |
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$NAME" = fluid ]; then REPO="$BASE"; else REPO="$BASE/$NAME"; fi
          TAGS="$REPO:${GITHUB_SHA::8}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAGS="$TAGS,$REPO:latest"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAGS="$TAGS,$REPO:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cli-pack]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
          path: out/
      # The ./ matters: npm reads `out/x.tgz` as a GitHub `owner/repo` shorthand.
      - run: npm publish ./out/badetitou-fluid-*.tgz --access public
