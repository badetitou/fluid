name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Allow the (locked) Prisma/esbuild build scripts to run non-interactively.
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Build frontend
        run: pnpm --filter @fluid/frontend build

  helm:
    name: Helm lint & manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint charts/fluid
          helm lint charts/fluid -f charts/fluid/values-local.yaml
          helm lint charts/fluid -f charts/fluid/values-cloud.yaml

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: |
          for f in values-local.yaml values-cloud.yaml; do
            echo "== $f =="
            helm template fluid charts/fluid -f "charts/fluid/$f" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0
          done
