# Default values for the fluid chart.
# This is a YAML-formatted file. Override with -f values-local.yaml / values-cloud.yaml.

# -- Registry/tag shared by all images unless a component overrides them.
# In CI these are published as ghcr.io/badetitou/fluid/fluid-<component>.
image:
  # e.g. "ghcr.io/badetitou/fluid" — leave empty to use locally-built images (kind/minikube).
  registry: ""
  # Global tag; defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# -- Optional imagePullSecrets for private registries (list of {name: ...}).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- Bundled PostgreSQL (used by the BFF) ------------------------------------
postgres:
  enabled: true
  image:
    # Third-party image — NOT prefixed with the global image.registry.
    registry: ""
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: fluid
    password: fluid
    database: fluid
  service:
    port: 5432
  persistence:
    enabled: true
    size: 1Gi
    # storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# --- External database (used when postgres.enabled = false) -----------------
externalDatabase:
  host: ""
  port: 5432
  username: fluid
  password: ""
  database: fluid

# --- Fluid BFF (views/preferences persistence + LLM proxy) ------------------
bff:
  enabled: true
  image:
    repository: fluid-bff
    tag: ""
  replicas: 1
  dbSchema: fluid_app
  service:
    port: 4001
  # LLM configuration. The frontend also sends per-request overrides, so this
  # is only needed if you want a server-side default provider/key.
  llm:
    # one of: "", "openai", "ollama", "mock" ("" => openai if a key is set, else mock)
    provider: ""
    openai:
      # Provide the key to enable server-side OpenAI; stored in a Secret.
      apiKey: ""
      model: ""
      baseUrl: ""
    ollama:
      model: ""
      baseUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# --- Frontend (nginx: static SPA + reverse proxy to the BFF) ---------------
frontend:
  enabled: true
  image:
    repository: fluid-frontend
    tag: ""
  replicas: 1
  service:
    # External service port; container listens on 8080.
    port: 80
  # Browser-facing runtime config written to /config.js at container start.
  # Empty bffUrl => same origin (nginx proxies /api).
  runtimeConfig:
    bffUrl: ""
    defaultGraphqlUrl: "https://rickandmortyapi.com/graphql"
    # Hosts the "image" format may load pictures from ("*.domain" for subdomains).
    # Empty => any https host; images are always loaded only after a user click.
    imageHosts: []
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi

# --- Ingress (single host in front of the frontend) -------------------------
ingress:
  enabled: false
  className: nginx
  host: fluid.local
  # Extra annotations, e.g. cert-manager or nginx tuning.
  annotations: {}
  tls:
    enabled: false
    secretName: fluid-tls
    # When using cert-manager, set annotations.cert-manager.io/cluster-issuer.

# --- Pod-level defaults -----------------------------------------------------
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
