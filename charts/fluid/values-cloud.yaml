# Cloud values: images pulled from the GitLab registry, ingress + TLS via cert-manager.
#
#   helm install fluid charts/fluid -f charts/fluid/values-cloud.yaml \
#     --set ingress.host=fluid.example.com
#
# GitLab CI publishes registry.gitlab.com/badetitou/fluid/fluid-<component> tagged with the
# release version (e.g. 0.1.1), `latest` (main) and the short commit sha.

image:
  registry: registry.gitlab.com/badetitou/fluid
  # Empty => chart appVersion. Pin a released version or an immutable sha tag.
  tag: ""
  pullPolicy: IfNotPresent

# The project is public, so no pull secret is needed. For a private fork:
# imagePullSecrets:
#   - name: gitlab-registry-pull-secret

postgres:
  # For production prefer a managed database: set enabled=false and fill in
  # externalDatabase below.
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: gp3

# externalDatabase:
#   host: my-postgres.internal
#   port: 5432
#   username: fluid
#   password: "change-me"
#   database: fluid

bff:
  llm:
    # Set to "openai" to enable server-side generation with the key below.
    provider: ""
    openai:
      apiKey: ""
      model: ""
      baseUrl: ""

ingress:
  enabled: true
  className: nginx
  host: fluid.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: fluid-tls
