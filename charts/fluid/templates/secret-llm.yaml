{{- if .Values.bff.enabled }}
{{- if .Values.bff.llm.openai.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluid.llm.secretName" . }}
  labels:
    {{- include "fluid.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.bff.llm.openai.apiKey | quote }}
{{- end }}
{{- end }}
