apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluid.db.secretName" . }}
  labels:
    {{- include "fluid.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- end }}
  app-url: {{ include "fluid.db.url" (list . .Values.bff.dbSchema) | quote }}
