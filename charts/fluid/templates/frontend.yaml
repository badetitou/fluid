{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fluid.frontend.fullname" . }}
  labels:
    {{- include "fluid.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "fluid.selectorLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluid.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "fluid.image" (list . .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FRONTEND_PORT
              value: "8080"
            - name: BFF_UPSTREAM
              value: {{ printf "http://%s:%v" (include "fluid.bff.fullname" .) .Values.bff.service.port | quote }}
            - name: BACKEND_UPSTREAM
              value: {{ printf "http://%s:%v" (include "fluid.backendDemo.fullname" .) .Values.backendDemo.service.port | quote }}
            - name: FLUID_BFF_URL
              value: {{ .Values.frontend.runtimeConfig.bffUrl | quote }}
            - name: FLUID_DEFAULT_GRAPHQL_URL
              value: {{ .Values.frontend.runtimeConfig.defaultGraphqlUrl | quote }}
            - name: FLUID_IMAGE_HOSTS
              value: {{ join "," (.Values.frontend.runtimeConfig.imageHosts | default list) | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fluid.frontend.fullname" . }}
  labels:
    {{- include "fluid.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
  selector:
    {{- include "fluid.selectorLabels" (list . "frontend") | nindent 4 }}
{{- end }}
