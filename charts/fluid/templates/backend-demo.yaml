{{- if .Values.backendDemo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fluid.backendDemo.fullname" . }}
  labels:
    {{- include "fluid.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-demo
spec:
  replicas: {{ .Values.backendDemo.replicas }}
  selector:
    matchLabels:
      {{- include "fluid.selectorLabels" (list . "backend-demo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluid.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend-demo
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "fluid.image" (list . .Values.backendDemo.image) | quote }}
          imagePullPolicy: {{ .Values.backendDemo.image.pullPolicy | default .Values.image.pullPolicy }}
          command: ["sh", "-c", "until node_modules/.bin/prisma migrate deploy; do echo 'waiting for database...'; sleep 3; done"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluid.db.secretName" . }}
                  key: bank-url
      containers:
        - name: backend-demo
          image: {{ include "fluid.image" (list . .Values.backendDemo.image) | quote }}
          imagePullPolicy: {{ .Values.backendDemo.image.pullPolicy | default .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fluid.db.secretName" . }}
                  key: bank-url
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backendDemo.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fluid.backendDemo.fullname" . }}
  labels:
    {{- include "fluid.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-demo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backendDemo.service.port }}
      targetPort: http
  selector:
    {{- include "fluid.selectorLabels" (list . "backend-demo") | nindent 4 }}
{{- end }}
