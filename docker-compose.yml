# Local development stack for fluid.
# Starts the PostgreSQL instance used by @fluid/bff (views, preferences).
#
# Usage:
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluid
      POSTGRES_PASSWORD: fluid
      POSTGRES_DB: fluid
    ports:
      - "5432:5432"
    volumes:
      - fluid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluid -d fluid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fluid-pgdata:
