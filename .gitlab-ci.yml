# GitLab CI for fluid.
#
#   test        typecheck and tests of every workspace
#   cli:pack    builds the npm tarball (@badetitou/fluid) and smoke-tests it in this Linux image
#   container:image builds and pushes the container images to the GitLab registry
#   pages       publishes the frontend on GitLab Pages (https://fluid.badetitou.fr)
#   npm:publish publishes the tarball to npm on version tags (vX.Y.Z), through npm Trusted
#               Publishing (OIDC): no npm token is stored in GitLab.
#
# Releasing: push a tag `vX.Y.Z` on main. The package version is taken from the tag.
#
# Optional CI/CD variables for the Pages build (Settings → CI/CD → Variables):
#   FLUID_BFF_URL              BFF base URL (e.g. https://fluid-bff.example.org). Empty = no BFF.
#   FLUID_DEFAULT_GRAPHQL_URL  GraphQL URL pre-filled on the connect screen.

stages: [test, build, deploy, publish]

default:
  image: node:22-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    # Only the frontend and its workspace deps (@fluid/shared): enough for the Pages build.
    - pnpm install --frozen-lockfile --filter "@fluid/frontend..."

.full-install: &full-install
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  # Prisma and esbuild run install scripts.
  - pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

.release-tag: &release-tag
  if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

.checks-rules: &checks-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - *release-tag

test:
  stage: test
  before_script: *full-install
  script:
    - pnpm -r typecheck
    - pnpm test
  <<: *checks-rules

cli:pack:
  stage: test
  before_script: *full-install
  script:
    # On a release tag, the package version is the tag (v1.2.3 → 1.2.3).
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        node -e 'const fs=require("fs");const f="apps/cli/package.publish.json";const p=JSON.parse(fs.readFileSync(f,"utf8"));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "${CI_COMMIT_TAG#v}"
      fi
    - pnpm pack:cli
    - pnpm test:pack
  artifacts:
    paths: [out/]
    expire_in: 1 week
  <<: *checks-rules

container:image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  needs: [test]
  parallel:
    matrix:
      - NAME: fluid
        DOCKERFILE: Dockerfile
      - NAME: fluid-bff
        DOCKERFILE: apps/bff/Dockerfile
      - NAME: fluid-frontend
        DOCKERFILE: apps/frontend/Dockerfile
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # registry.gitlab.com/badetitou/fluid for the all-in-one image, …/fluid/fluid-bff and
    # …/fluid/fluid-frontend for the Helm chart.
    - if [ "$NAME" = fluid ]; then REPO="$CI_REGISTRY_IMAGE"; else REPO="$CI_REGISTRY_IMAGE/$NAME"; fi
    - TAGS="$CI_COMMIT_SHORT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then TAGS="$TAGS latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS ${CI_COMMIT_TAG#v}"; fi
    - ARGS=""; for t in $TAGS; do ARGS="$ARGS -t $REPO:$t"; done
    - docker build -f "$DOCKERFILE" $ARGS .
    - for t in $TAGS; do docker push "$REPO:$t"; done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - *release-tag

npm:publish:
  stage: publish
  # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.
  image: node:24-bookworm-slim
  cache: []
  needs:
    - job: test
      artifacts: false
    - job: cli:pack
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - npm install --global npm@11
  script:
    - npm publish out/badetitou-fluid-*.tgz --access public
  rules:
    - *release-tag

pages:
  stage: deploy
  variables:
    # Served at the root of the custom domain https://fluid.badetitou.fr.
    PAGES_BASE_PATH: '/'
  script:
    # Base path: PAGES_BASE_PATH when set (custom domain → "/"), otherwise derived from
    # the Pages URL ("/<project>/" for https://<ns>.gitlab.io/<project>, "/" for unique domains).
    - export VITE_BASE="${PAGES_BASE_PATH:-$(echo "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##; s#/*$##')/}"
    - echo "Building with base '$VITE_BASE'"
    - pnpm --filter @fluid/frontend build
    - rm -rf public && cp -r apps/frontend/dist public
    # Runtime config (same contract as apps/frontend/docker/entrypoint.sh).
    - |
      cat > public/config.js <<EOF
      window.__FLUID_CONFIG__ = {
        bffUrl: "${FLUID_BFF_URL:-}",
        defaultGraphqlUrl: "${FLUID_DEFAULT_GRAPHQL_URL:-}"
      };
      EOF
    # SPA fallback: GitLab Pages serves 404.html for unknown paths (deep links / refresh).
    - cp public/index.html public/404.html
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
