# GitLab CI — builds the Fluid frontend and publishes it on GitLab Pages.
#
# The frontend is a static SPA: it works without the BFF (curated/auto views,
# preferences in localStorage). Saved views and LLM generation need a BFF
# reachable from the browser — point FLUID_BFF_URL at it if you deploy one.
#
# Optional CI/CD variables (Settings → CI/CD → Variables):
#   FLUID_BFF_URL              BFF base URL (e.g. https://fluid-bff.onrender.com). Empty = no BFF.
#   FLUID_DEFAULT_GRAPHQL_URL  GraphQL URL pre-filled on the connect screen.

default:
  image: node:22-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    # Only the frontend and its workspace deps (@fluid/shared): no Prisma needed.
    - pnpm install --frozen-lockfile --filter "@fluid/frontend..."

stages: [test, deploy]

frontend:test:
  stage: test
  script:
    - pnpm --filter @fluid/frontend typecheck
    - pnpm --filter @fluid/frontend test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  variables:
    # Served at the root of the custom domain https://fluid.badetitou.fr.
    PAGES_BASE_PATH: '/'
  script:
    # Base path: PAGES_BASE_PATH when set (custom domain → "/"), otherwise derived from
    # the Pages URL ("/<project>/" for https://<ns>.gitlab.io/<project>, "/" for unique domains).
    - export VITE_BASE="${PAGES_BASE_PATH:-$(echo "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##; s#/*$##')/}"
    - echo "Building with base '$VITE_BASE'"
    - pnpm --filter @fluid/frontend build
    - rm -rf public && cp -r apps/frontend/dist public
    # Runtime config (same contract as apps/frontend/docker/entrypoint.sh).
    - |
      cat > public/config.js <<EOF
      window.__FLUID_CONFIG__ = {
        bffUrl: "${FLUID_BFF_URL:-}",
        defaultGraphqlUrl: "${FLUID_DEFAULT_GRAPHQL_URL:-}"
      };
      EOF
    # SPA fallback: GitLab Pages serves 404.html for unknown paths (deep links / refresh).
    - cp public/index.html public/404.html
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
